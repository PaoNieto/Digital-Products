<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Las ilustraciones de los ejercicios</title>
<link rel="stylesheet" href="../estilo.css">
<style>
  body { width: 620px; padding: 20pt; }
  h1 { font-size: 18pt; margin-bottom: 3pt; }
  .nota { font-size: 9.5pt; color: var(--gris); margin-bottom: 14pt; line-height: 1.5; }
  .grilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12pt 10pt; }
  figure { margin: 0; }
  figure img { width: 100%; display: block; border-radius: 6pt; }
  figcaption { font-size: 8pt; color: var(--gris); margin-top: 3pt;
                text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>
  <h1>Las 27 ilustraciones</h1>
  <p class="nota">Mismo marco, misma linea de piso, mismos grosores, misma silueta sin
  cara. Lo unico que cambia es la pose y hacia donde apunta la flecha.<br>
  Esta hoja la arma solo <em>generar.py</em>: nunca queda vieja.</p>
  <div class="grilla">
    <figure><img src="respiracion-360.svg" alt=""><figcaption>respiracion 360</figcaption></figure>
    <figure><img src="exhalacion-con-cierre.svg" alt=""><figcaption>exhalacion con cierre</figcaption></figure>
    <figure><img src="hipopresivo-suave.svg" alt=""><figcaption>hipopresivo suave</figcaption></figure>
    <figure><img src="cierre-de-pie.svg" alt=""><figcaption>cierre de pie</figcaption></figure>
    <figure><img src="marcha-costillas-abajo.svg" alt=""><figcaption>marcha costillas abajo</figcaption></figure>
    <figure><img src="empuje-contra-la-pared.svg" alt=""><figcaption>empuje contra la pared</figcaption></figure>
    <figure><img src="antigiro-con-toalla.svg" alt=""><figcaption>antigiro con toalla</figcaption></figure>
    <figure><img src="sentadilla-a-la-silla.svg" alt=""><figcaption>sentadilla a la silla</figcaption></figure>
    <figure><img src="elevacion-de-talones.svg" alt=""><figcaption>elevacion de talones</figcaption></figure>
    <figure><img src="estiramiento-de-flexores.svg" alt=""><figcaption>estiramiento de flexores</figcaption></figure>
    <figure><img src="plancha-lateral-rodillas.svg" alt=""><figcaption>plancha lateral rodillas</figcaption></figure>
    <figure><img src="bicho-muerto.svg" alt=""><figcaption>bicho muerto</figcaption></figure>
    <figure><img src="perro-pajaro.svg" alt=""><figcaption>perro pajaro</figcaption></figure>
    <figure><img src="giro-sentada.svg" alt=""><figcaption>giro sentada</figcaption></figure>
    <figure><img src="rodillas-al-costado.svg" alt=""><figcaption>rodillas al costado</figcaption></figure>
    <figure><img src="estiramiento-de-costado.svg" alt=""><figcaption>estiramiento de costado</figcaption></figure>
    <figure><img src="puente-de-gluteo.svg" alt=""><figcaption>puente de gluteo</figcaption></figure>
    <figure><img src="puente-a-una-pierna.svg" alt=""><figcaption>puente a una pierna</figcaption></figure>
    <figure><img src="almeja.svg" alt=""><figcaption>almeja</figcaption></figure>
    <figure><img src="patada-atras.svg" alt=""><figcaption>patada atras</figcaption></figure>
    <figure><img src="plancha-antebrazos.svg" alt=""><figcaption>plancha antebrazos</figcaption></figure>
    <figure><img src="postura-del-nino.svg" alt=""><figcaption>postura del nino</figcaption></figure>
    <figure><img src="marcha-en-el-lugar.svg" alt=""><figcaption>marcha en el lugar</figcaption></figure>
    <figure><img src="paso-lateral.svg" alt=""><figcaption>paso lateral</figcaption></figure>
    <figure><img src="caminata-nariz.svg" alt=""><figcaption>caminata nariz</figcaption></figure>
    <figure><img src="gato-camello.svg" alt=""><figcaption>gato camello</figcaption></figure>
    <figure><img src="rotacion-de-columna.svg" alt=""><figcaption>rotacion de columna</figcaption></figure>
  </div>
</body>
</html>
