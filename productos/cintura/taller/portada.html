<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plana todo el día</title>
<link rel="stylesheet" href="estilo.css">
<style>
  @page { size: 6in 9in; margin: 0; }
  html, body { width: 6in; height: 9in; overflow: hidden; }
</style>
</head>
<body>
<div class="tapa">

  <div class="bloque">
    <div class="sello">Reto de 28 días</div>
    <div class="titulo">Plana<br>todo<br>el día</div>
  </div>

  <div class="cinta">
    <svg viewBox="0 0 480 96" width="100%" role="img" aria-label="Cinta métrica con dos marcas: 9 de la mañana y 9 de la noche">
      <rect x="0" y="0" width="480" height="58" rx="10" fill="#FFFFFF"/>
      <g stroke="#0E7C66" stroke-width="2.4" stroke-linecap="round">
        <!-- marcas cortas cada 12, una larga cada 60 -->
        <line x1="24"  y1="0" x2="24"  y2="15"/><line x1="36"  y1="0" x2="36"  y2="9"/>
        <line x1="48"  y1="0" x2="48"  y2="9"/> <line x1="60"  y1="0" x2="60"  y2="9"/>
        <line x1="72"  y1="0" x2="72"  y2="9"/> <line x1="84"  y1="0" x2="84"  y2="15"/>
        <line x1="96"  y1="0" x2="96"  y2="9"/> <line x1="108" y1="0" x2="108" y2="9"/>
        <line x1="120" y1="0" x2="120" y2="9"/> <line x1="132" y1="0" x2="132" y2="9"/>
        <line x1="144" y1="0" x2="144" y2="15"/><line x1="156" y1="0" x2="156" y2="9"/>
        <line x1="168" y1="0" x2="168" y2="9"/> <line x1="180" y1="0" x2="180" y2="9"/>
        <line x1="192" y1="0" x2="192" y2="9"/> <line x1="204" y1="0" x2="204" y2="15"/>
        <line x1="216" y1="0" x2="216" y2="9"/> <line x1="228" y1="0" x2="228" y2="9"/>
        <line x1="240" y1="0" x2="240" y2="9"/> <line x1="252" y1="0" x2="252" y2="9"/>
        <line x1="264" y1="0" x2="264" y2="15"/><line x1="276" y1="0" x2="276" y2="9"/>
        <line x1="288" y1="0" x2="288" y2="9"/> <line x1="300" y1="0" x2="300" y2="9"/>
        <line x1="312" y1="0" x2="312" y2="9"/> <line x1="324" y1="0" x2="324" y2="15"/>
        <line x1="336" y1="0" x2="336" y2="9"/> <line x1="348" y1="0" x2="348" y2="9"/>
        <line x1="360" y1="0" x2="360" y2="9"/> <line x1="372" y1="0" x2="372" y2="9"/>
        <line x1="384" y1="0" x2="384" y2="15"/><line x1="396" y1="0" x2="396" y2="9"/>
        <line x1="408" y1="0" x2="408" y2="9"/> <line x1="420" y1="0" x2="420" y2="9"/>
        <line x1="432" y1="0" x2="432" y2="9"/> <line x1="444" y1="0" x2="444" y2="15"/>
      </g>
      <!-- las dos marcas del ritual de medirse -->
      <g fill="#1A1A1A">
        <polygon points="120,58 112,44 128,44"/>
        <polygon points="360,58 352,44 368,44"/>
      </g>
      <g font-family="Open Sans" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">
        <text x="120" y="82">9 AM</text>
        <text x="360" y="82">9 PM</text>
      </g>
      <line x1="136" y1="70" x2="344" y2="70" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="3 5"/>
    </svg>
  </div>

  <div class="abajo">
    <p class="bajada">Reto de 28 días para desinflamar el abdomen y marcar cintura</p>
    <p class="pie-tapa">10 min al día · sin dieta · sin equipo</p>
  </div>

</div>
</body>
</html>
