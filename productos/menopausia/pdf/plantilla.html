<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{TITULO_TEXTO}}</title>
<link rel="stylesheet" href="{{CSS}}">
</head>
<body class="{{CLASE_BODY}}">

<!-- Pagina 1: portada. El texto sale del front matter del contenido (titulo y subtitulo). -->
<section class="portada">
  <div class="portada-icono" aria-hidden="true">
    <!-- Calendario con una marca: "plan para seguir y marcar". Dibujado en SVG, sin imagenes de IA. -->
    <svg viewBox="0 0 48 48" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="9" width="38" height="34" rx="5"/>
      <line x1="5" y1="18.5" x2="43" y2="18.5"/>
      <line x1="15" y1="4.5" x2="15" y2="12.5"/>
      <line x1="33" y1="4.5" x2="33" y2="12.5"/>
      <polyline points="15.5,30.5 21.5,36.5 33,25"/>
    </svg>
  </div>
  <h1 class="portada-titulo" id="portada-titulo">{{TITULO}}</h1>
  <div class="portada-linea"></div>
  <p class="portada-subtitulo">{{SUBTITULO}}</p>
  <p class="portada-aviso">{{AVISO}}</p>
</section>

<!-- Pagina 2: la primera seccion del contenido ("Empieza aqui"). -->
{{PRIMERA_SECCION}}

<!-- Despues: el indice, armado solo a partir de los # del contenido. -->
<nav class="indice" id="indice">
  <h1>Índice</h1>
  <ol>
{{INDICE}}
  </ol>
</nav>

{{RESTO}}

</body>
</html>
